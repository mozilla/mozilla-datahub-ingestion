version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  lint:
    executor:
      name: python/default
      tag: 3.10.10
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Run linters
          command: make lint
  unit-tests:
    executor:
      name: python/default
      tag: 3.10.10
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Run tests
          command: python -m pytest

workflows:
  ci:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
